buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
        maven { url "https://repo.grails.org/grails/core" }
        maven { url 'https://jitpack.io' }
    }
    dependencies {
        classpath "org.springframework.boot:spring-boot-gradle-plugin:2.7.18"
        classpath "org.grails:grails-gradle-plugin:$grailsGradlePluginVersion"
        classpath "com.bertramlabs.plugins:asset-pipeline-gradle:3.4.7"
    }
}

version "0.1.5"
group "grails.security.stateless.ng"

apply plugin:"eclipse"
apply plugin:"idea"
apply plugin:"org.springframework.boot"
apply plugin:"org.grails.grails-plugin"
apply plugin:"org.grails.grails-gsp"
apply plugin:"com.bertramlabs.asset-pipeline"
apply plugin:"maven-publish"

repositories {
    mavenLocal()
    mavenCentral()
    maven { url "https://repo.grails.org/grails/core" }
    maven { url 'https://jitpack.io' }
}

configurations.all {
    resolutionStrategy.eachDependency { DependencyResolveDetails details ->
        if (details.requested.group == 'org.springframework.boot' && details.requested.name == 'spring-boot-dependencies') {
            details.useVersion '2.7.18'
        }
    }
}

dependencies {
    implementation "org.springframework.boot:spring-boot-starter-logging"
    implementation "org.springframework.boot:spring-boot-autoconfigure"
    implementation "org.grails:grails-core"
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-tomcat"
    implementation "org.grails:grails-web-boot"
    implementation "org.grails:grails-logging"
    implementation "org.grails:grails-plugin-rest"
    implementation "org.grails:grails-plugin-i18n"
    implementation "org.grails:grails-plugin-services"
    implementation "org.grails:grails-plugin-url-mappings"
    implementation "org.grails:grails-plugin-interceptors"
    implementation "org.grails.plugins:async"
    implementation "org.grails.plugins:scaffolding"
    implementation "org.grails.plugins:gsp"
    
    console "org.grails:grails-console"
    profile "org.grails.profiles:web-plugin"
    
    compileOnly "org.grails:grails-plugin-services"
    
    runtimeOnly "com.bertramlabs.plugins:asset-pipeline-grails:2.14.2"
    
    testImplementation "org.grails:grails-gorm-testing-support"
    testImplementation "org.grails:grails-plugin-testing"
    testImplementation "org.grails:grails-web-testing-support"

    implementation group: 'joda-time', name: 'joda-time', version: '2.10.1'
}

bootRun {
    jvmArgs('-Dspring.output.ansi.enabled=always')
    String springProfilesActive = 'spring.profiles.active'
    systemProperty springProfilesActive, System.getProperty(springProfilesActive)
}

bootJar.enabled = false
jar.enabled = true

// Fix for asset-pipeline when assets directory doesn't exist
tasks.withType(asset.pipeline.gradle.AssetPluginPackage) {
    onlyIf { project.file('grails-app/assets').exists() }
}

// Maven publishing for JitPack
publishing {
    publications {
        maven(MavenPublication) {
            //from components.java

            groupId = 'com.github.ppazos'
            artifactId = 'grails-security-stateless-ng'
            version = project.version
            
            artifact jar  // Explicitly include the jar
            
            pom {
                name = 'Stateless Security NG Grails Plugin'
                description = 'Grails plugin for stateless security using JWT tokens'
                url = 'https://github.com/ppazos/grails-security-stateless-ng'
                
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                
                developers {
                    developer {
                        id = 'ppazos'
                        name = 'Pablo Pazos'
                    }
                }
                
                scm {
                    url = 'https://github.com/ppazos/grails-security-stateless-ng'
                }
            }
        }
    }
}

assets {
    packagePlugin = true
}